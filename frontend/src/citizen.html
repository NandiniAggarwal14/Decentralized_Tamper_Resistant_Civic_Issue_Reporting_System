<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="public_feed">Public Civic Feed — Citizen Dashboard</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <div class="dashboard-layout">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-text">
          <h1 data-i18n="title">Decentralized Portal</h1>
          <p data-i18n="citizen_console">Citizen Console</p>
        </div>
      </div>

      <!-- Profile Card -->
      <div class="sidebar-profile">
        <div class="profile-avatar" id="profile-initials">C</div>
        <div class="profile-info">
          <div class="name" id="profile-name">Citizen User</div>
          <div class="role" id="profile-role" data-i18n="citizen">Citizen</div>
        </div>
      </div>

      <!-- Navigation links -->
      <nav class="sidebar-nav">
        <a class="nav-link active" href="/citizen.html">
          <span></span> <span data-i18n="public_feed">Public Feed</span>
        </a>
        <a class="nav-link" href="/report.html">
          <span>📝</span> <span data-i18n="report_complaint">Report Issue</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button onclick="auth.logout()" class="btn btn-danger" style="width: 100%;" data-i18n="signout">Logout</button>
      </div>
    </aside>

    <!-- RIGHT CONTENT AREA -->
    <main style="padding: 40px; overflow-y: auto; height: 100vh; width: 100%;">
      <div style="max-width: 800px; margin: 0 auto;">
        
        <!-- Welcome Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
          <div>
            <h2 data-i18n="public_feed">Public Civic Feed</h2>
            <p style="font-size: 0.9rem; color: var(--text-secondary);">Browse, vote, and verify real-time local reports on-chain</p>
          </div>
          <div style="display: flex; gap: 8px;">
            <button onclick="toggleMap()" class="btn btn-secondary" style="padding: 8px 16px;">🗺️ Toggle Map</button>
            <button onclick="loadIssues()" class="btn btn-secondary" style="padding: 8px 16px;" data-i18n="refresh">Refresh</button>
          </div>
        </div>

        <!-- Notification Banner -->
        <div id="alert-banner" class="alert-banner alert-success" style="display: none; margin-bottom: 16px;">
          <span id="alert-text">Status update message</span>
        </div>

        <!-- Interactive Folium OpenStreetMap -->
        <div id="issue-map-container" style="height: 420px; width: 100%; border-radius: 12px; margin-bottom: 24px; display: none; overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow-sm);">
          <iframe id="issue-map-iframe" src="" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>


        <!-- List of Issues -->
        <div id="feed-container" class="feed-grid">

          <p style="text-align: center; color: var(--text-secondary); padding: 40px;" data-i18n="loading_reports">Loading civic reports...</p>
        </div>

      </div>
    </main>

  </div>

  <!-- Status Trail Modal -->
  <div class="modal-overlay" id="trail-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;">
    <div class="card" style="max-width: 500px; width: 90%; max-height: 80%; overflow-y: auto; padding: 24px; position: relative; border: 1px solid var(--border);">
      <span onclick="closeTrailModal()" style="position: absolute; top: 16px; right: 16px; cursor: pointer; font-size: 1.5rem; color: var(--text-muted);">&times;</span>
      <h3 style="margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px;">📋 Issue Resolution Status Trail</h3>
      <div id="trail-stepper" class="stepper-container">
        <!-- Stepper content will be dynamically generated -->
      </div>
    </div>
  </div>

  <script src="/assets/i18n.js"></script>
  <script src="/assets/auth.js"></script>
  <script src="/assets/citizen.js"></script>
</body>
</html>
